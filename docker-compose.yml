services:
  education-agent:
    build: .
    container_name: education-agent
    restart: unless-stopped
    user: "0:0"
    ports:
      - "${PORT:-5107}:5107"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5107
      SESSION_SECRET: ${SESSION_SECRET:?please-set-session-secret-in-env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-3221225472}
      AI_PDF_AGENT_TIMEOUT_MS: ${AI_PDF_AGENT_TIMEOUT_MS:-480000}
      PDF_AGENT_TIMEOUT_MS: ${PDF_AGENT_TIMEOUT_MS:-1200000}
      DIFY_BASE_URL: ${DIFY_BASE_URL_CONTAINER:-http://host.docker.internal:8080/v1}
      DIFY_WORKFLOW_API_KEY: ${DIFY_WORKFLOW_API_KEY:-}
      DIFY_WORKFLOW_USER_PREFIX: ${DIFY_WORKFLOW_USER_PREFIX:-education-agent}
      DIFY_WORKFLOW_TIMEOUT_MS: ${DIFY_WORKFLOW_TIMEOUT_MS:-60000}
      DIFY_PROJECT_BASE_URL: ${DIFY_PROJECT_BASE_URL:-http://host.docker.internal:5107}
      DIFY_GRAPH_CONTEXT_URL: ${DIFY_GRAPH_CONTEXT_URL:-http://host.docker.internal:5107/api/integrations/dify/graph-context}
      DIFY_CALLBACK_URL: ${DIFY_CALLBACK_URL:-http://host.docker.internal:5107/api/integrations/dify/diagnosis-callback}
      DIFY_CALLBACK_TOKEN: ${DIFY_CALLBACK_TOKEN:?please-set-dify-callback-token-in-env}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
